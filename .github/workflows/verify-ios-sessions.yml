name: Verify iOS native session build
on:
  push:
    branches: [Minh/verify-ios-staff-sessions]
permissions:
  contents: read
jobs:
  xcode-build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npm run build:mobile -- https://inventory.example.com
      - run: npx cap sync ios
      - name: Compile iOS release
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
